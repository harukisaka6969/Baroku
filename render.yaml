services:
  - type: web
    name: baroku-api
    env: python
    pythonVersion: "3.11.0"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: baroku-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://baroku.vercel.app
      - key: SCRAPER_DELAY
        value: "2"
      - key: ADMIN_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: baroku-db
    plan: free
    databaseName: baroku
    user: baroku
